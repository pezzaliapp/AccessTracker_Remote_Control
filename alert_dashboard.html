<!DOCTYPE html>
<html lang="it" data-theme="">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🛡️ Alert HID Tracker</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 40px;
      background: #000;
      color: #fff;
    }
    h1 { margin-bottom: 1em; }
    table {
      margin: auto;
      border-collapse: collapse;
      width: 90%;
      max-width: 800px;
    }
    th, td {
      border: 1px solid #444;
      padding: 8px;
      text-align: left;
    }
    th {
      background: #111;
    }
    tr:nth-child(even) {
      background: #222;
    }
  </style>
</head>
<body>

  <h1>🛡️ Alert HID Tracker</h1>
  <p>Visualizzazione in tempo reale degli alert registrati</p>

  <table id="alertTable">
    <thead>
      <tr><th>⏱️ Timestamp</th><th>📄 Tipo</th><th>🖥️ Dispositivo</th></tr>
    </thead>
    <tbody></tbody>
  </table>

  <!-- Firebase SDK compat -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCm9lIf2l8FQHiIUoSbtOmLRQNxtgCJd6Q",
      authDomain: "accesstracker-5d3f9.firebaseapp.com",
      projectId: "accesstracker-5d3f9",
      storageBucket: "accesstracker-5d3f9.appspot.com",
      messagingSenderId: "331964316032",
      appId: "1:331964316032:web:8fcc4efdc180a40201a965"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const tbody = document.querySelector("#alertTable tbody");

    function render(doc) {
      const data = doc.data();
      const row = document.createElement("tr");
      row.innerHTML = `
        <td>${data.timestamp || "–"}</td>
        <td>${data.tipo || "–"}</td>
        <td>${data.dispositivo || "–"}</td>
      `;
      tbody.prepend(row);
    }

    firebase.auth().signInAnonymously().then(() => {
      db.collection("alert").orderBy("timestamp", "desc").limit(30)
        .onSnapshot(snap => {
          tbody.innerHTML = "";
          snap.forEach(doc => render(doc));
        });
    });
  </script>
</body>
</html>
